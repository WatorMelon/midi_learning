<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>MIDI乐理学习键盘</title>
<script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif;}
:root{
  --bg:#e8ff63cb;
  --bg-panel:#ffffff;
  --text:#222233;
  --text-muted:#666;
  --white-key:#ffffff;
  --white-key-active:#ffd6ef;
  --black-key:#222222;
  --black-key-active:#b86baf;
  --chord-highlight:#ffe066;
  --chord-highlight-dark:#ffcc00;
  --accent:#ff77bb;
  --accent-2:#77aaff;
  --danger:#ff6666;
  --border:#ddd;
  --shadow:0 4px 16px rgba(0,0,0,0.08);
  --transition:0.22s cubic-bezier(0.4,0,0.2,1);
  --metro-bg:#2a2a33;
  --metro-btn-bg:#3a3a45;
  --metro-btn-hover:#4a4a58;
  --metro-text:#f0f0f5;
  --metro-accent:#ff77bb;
  --metro-beat-on:#77eeaa;
  --metro-beat-strong:#ff77bb;
  --key-scale: 1;
}
[data-theme="dark"]{
  --bg:#1a1423;
  --bg-panel:#271f38;
  --text:#f0edf7;
  --text-muted:#aaa;
  --white-key:#ffffff;
  --white-key-active:#ffb8dd;
  --black-key:#111111;
  --black-key-active:#703868;
  --border:#443858;
  --shadow:0 4px 18px rgba(0,0,0,0.45);
}
body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  transition:background var(--transition),color var(--transition);
  padding:12px;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
  flex-wrap:wrap;
  gap:10px;
}
h1{
  font-size:1.4rem;
  font-weight:600;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  -webkit-background-clip:text;
  color:transparent;
}
.header-buttons{
  display:flex;
  gap:8px;
  align-items:center;
}
.theme-toggle,.setting-toggle{
  background:none;
  border:none;
  font-size:1.4rem;
  cursor:pointer;
  padding:6px 10px;
  border-radius:10px;
  background:var(--bg-panel);
  box-shadow:var(--shadow);
  transition:var(--transition);
}
.theme-toggle:hover,.setting-toggle:hover{transform:scale(1.08);}

.metronome-panel{
  background:var(--metro-bg);
  border-radius:12px;
  padding:12px 16px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
  color:var(--metro-text);
}
.metro-controls{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.metro-btn{
  background:var(--metro-btn-bg);
  border:none;
  color:var(--metro-text);
  padding:8px 14px;
  border-radius:6px;
  cursor:pointer;
  font-size:1rem;
  transition:all 0.15s ease;
  min-width:40px;
  text-align:center;
  user-select:none;
}
.metro-btn:hover{
  background:var(--metro-btn-hover);
  transform:translateY(-1px);
}
.metro-btn:active{
  transform:translateY(1px);
}
.tap-btn{
  font-weight:600;
  padding:8px 18px;
}
.bpm-display{
  display:flex;
  align-items:center;
  gap:6px;
  background:#1a1a22;
  padding:4px 10px;
  border-radius:6px;
  border:1px solid #444;
  user-select:none;
}
.bpm-num-group{
  display:flex;
  align-items:baseline;
}
#bpmInt{
  font-size:1.6rem;
  font-weight:700;
  color:var(--metro-accent);
  font-variant-numeric:tabular-nums;
  cursor:ns-resize;
}
.bpm-dot{
  font-size:1.2rem;
  color:var(--metro-accent);
  margin:0 1px;
}
#bpmDec{
  font-size:1rem;
  font-weight:600;
  color:var(--metro-accent);
  font-variant-numeric:tabular-nums;
  opacity:0.85;
  min-width:22px;
  cursor:ns-resize;
}
.bpm-input{
  background:transparent;
  border:none;
  color:var(--metro-accent);
  font-size:1.6rem;
  font-weight:700;
  width:80px;
  text-align:center;
  outline:none;
  font-variant-numeric:tabular-nums;
}
.bpm-adjust{
  display:flex;
  flex-direction:column;
  gap:2px;
}
.bpm-arrow{
  background:none;
  border:none;
  color:var(--metro-text);
  font-size:0.6rem;
  cursor:pointer;
  padding:0 2px;
  line-height:1;
  opacity:0.7;
}
.bpm-arrow:hover{opacity:1;}

.beat-indicators{
  display:flex;
  gap:6px;
  align-items:center;
  height:30px;
  margin-left:8px;
}
.beat-light{
  width:6px;
  height:24px;
  background:#444;
  border-radius:2px;
  transition:all 0.08s ease;
}
.beat-light.active{
  background:var(--metro-beat-on);
  box-shadow:0 0 8px var(--metro-beat-on);
}
.beat-light.strong{
  background:var(--metro-beat-strong);
  box-shadow:0 0 10px var(--metro-beat-strong);
}

.time-signature{
  display:flex;
  align-items:center;
  gap:4px;
  margin-left:auto;
}
.time-signature select{
  background:var(--metro-btn-bg);
  color:var(--metro-text);
  border:none;
  padding:6px 8px;
  border-radius:6px;
  font-size:1rem;
  font-weight:600;
  cursor:pointer;
  width:50px;
  text-align:center;
}
.ts-slash{
  font-size:1.2rem;
  font-weight:700;
}

.setting-modal-wrap{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:none;
  z-index:99;
  align-items:center;
  justify-content:center;
}
.setting-modal{
  background:var(--bg-panel);
  border-radius:16px;
  padding:18px;
  min-width:320px;
  max-width:90vw;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
}
.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}
.modal-close{
  border:none;background:transparent;font-size:1.3rem;cursor:pointer;
  color:var(--text);
}
.settings-grid{
  display:grid;
  gap:14px;
}
.setting-item{
  display:flex;
  flex-direction:column;
  gap:4px;
  font-size:0.88rem;
}

.panel{
  background:var(--bg-panel);
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
}
.info-panel{
  display:flex;
  gap:16px;
  align-items:stretch;
}
.left-info{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.staff-box{
  flex:1;
  min-width:320px;
  background:rgba(255,255,255,0.7);
  border-radius:10px;
  padding:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.staff-box.hidden{
  display:none;
}
#staffCanvas{
  width:100%;
  height:210px;
  display:block;
}
.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  margin:8px 0;
}
select,button{
  padding:8px 10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--bg-panel);
  color:var(--text);
  font-size:0.92rem;
  transition:var(--transition);
  cursor:pointer;
}
button:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,0.12);}
.info-line{margin:6px 0;font-size:0.94rem;color:var(--text-muted);}
.chord-display{
  font-size:1.3rem;
  font-weight:bold;
  margin:10px 0 4px 0;
  min-height:2.2rem;
  color:var(--accent);
}
.interval-display{
  font-size:1rem;
  color:var(--accent-2);
  margin-bottom:6px;
  min-height:1.4rem;
}
.interval-text{
  font-size:0.95rem;
  color:var(--text-muted);
  margin-bottom:10px;
  min-height:1.5rem;
}
.inversion-hint{font-size:0.84rem;color:var(--danger);margin-top:4px;}

.keyboard-wrap{
  overflow-x:auto;
  overflow-y:hidden;
  padding:10px 4px 20px 4px;
  touch-action: pan-x;
}
.keyboard{
  position:relative;
  height:220px;
  margin:0 auto;
  transform-origin: left center;
}
.white{
  width: calc(28px * var(--key-scale));
  height:220px;
  background:var(--white-key);
  border:1px solid var(--border);
  border-radius:0 0 6px 6px;
  position:absolute;
  top:0;
  cursor:pointer;
  transition:background 0.14s ease;
  z-index:1;
}
.white.active{
  background:var(--white-key-active);
  transform:translateY(2px);
}
.white.chord-highlight{
  background:var(--chord-highlight) !important;
}
.black{
  width: calc(18px * var(--key-scale));
  height:130px;
  background:var(--black-key);
  border-radius:0 0 5px 5px;
  position:absolute;
  z-index:2;
  top:0;
  cursor:pointer;
  transition:background 0.14s ease;
}
.black.active{
  background:var(--black-key-active);
  transform:translateY(2px);
}
.black.chord-highlight{
  background:var(--chord-highlight-dark) !important;
}
.key-label{
  position:absolute;
  bottom:6px;
  font-size:0.7rem;
  text-align:center;
  width:100%;
  pointer-events:none;
  color:#333;
}
.black .key-label{
  color:#ffffff;
}
[data-theme="dark"] .white .key-label{
  color:#22;
}
.inversion-note{
  box-shadow: inset 0 0 0 2px var(--danger) !important;
}

@media(max-width:700px){
  .keyboard{height:160px;}
  .white{height:160px;}
  .black{height:95px;}
  h1{font-size:1.1rem;}
  #bpmInt{font-size:1.3rem;}
  #bpmDec{font-size:0.9rem;}
  .metro-btn{padding:6px 10px;}
  .info-panel{flex-direction:column;}
  .staff-box{min-height:160px;}
}
</style>
</head>
<body>
<header>
  <h1>🎹 MIDI乐理学习键盘</h1>
  <div class="header-buttons">
    <button class="theme-toggle" id="themeBtn">🌙</button>
    <button class="setting-toggle" id="settingBtn">⚙</button>
  </div>
</header>

<div class="metronome-panel">
  <div class="metro-controls">
    <button class="metro-btn" id="playBtn" title="播放/暂停">▶</button>
    <button class="metro-btn" id="stopBtn" title="停止">■</button>
    <button class="metro-btn tap-btn" id="tapBtn">Tap</button>
    
    <div class="bpm-display">
      <div class="bpm-num-group">
        <span id="bpmInt">120</span><span class="bpm-dot">.</span><span id="bpmDec">00</span>
      </div>
      <div class="bpm-adjust">
        <button class="bpm-arrow" id="bpmUp">▲</button>
        <button class="bpm-arrow" id="bpmDown">▼</button>
      </div>
    </div>

    <div class="beat-indicators" id="beatIndicators">
      <span class="beat-light"></span>
      <span class="beat-light"></span>
      <span class="beat-light"></span>
      <span class="beat-light"></span>
    </div>

    <div class="time-signature">
      <select id="tsNumerator">
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4" selected>4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
      </select>
      <span class="ts-slash">/</span>
      <select id="tsDenominator">
        <option value="2">2</option>
        <option value="4" selected>4</option>
        <option value="8">8</option>
        <option value="16">16</option>
      </select>
    </div>
  </div>
</div>

<div class="setting-modal-wrap" id="settingModalWrap">
  <div class="setting-modal">
    <div class="modal-header">
      <h3>⚙ 设置</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="settings-grid">
      <div class="setting-item">
        <label>音名显示模式</label>
        <select id="noteLabelMode">
          <option value="all">全部音名</option>
          <option value="octaveOnly">仅八度名称</option>
          <option value="off">不显示音名</option>
        </select>
      </div>
      <div class="setting-item">
        <label>主题模式</label>
        <select id="themeSetting">
          <option value="system">跟随系统</option>
          <option value="light">浅色</option>
          <option value="dark">深色</option>
        </select>
      </div>
      <div class="setting-item">
        <label>和弦演示发音</label>
        <select id="chordSoundSetting">
          <option value="on">开启</option>
          <option value="off">关闭</option>
        </select>
      </div>
      <div class="setting-item">
        <label>节拍器音色</label>
        <select id="metroSoundSetting">
          <option value="classic">经典嘀嗒</option>
          <option value="wood">木鱼</option>
          <option value="electronic">电子</option>
          <option value="click">响板</option>
        </select>
      </div>
      <div class="setting-item">
        <label>鼠标滑奏</label>
        <select id="mouseGlideSetting">
          <option value="on">开启</option>
          <option value="off">关闭</option>
        </select>
      </div>
      <div class="setting-item">
        <label>五线谱显示</label>
        <select id="staffDisplaySetting">
          <option value="on">开启</option>
          <option value="off">关闭</option>
        </select>
      </div>
      <div class="setting-item">
        <label>音程显示</label>
        <select id="intervalDisplaySetting">
          <option value="on">开启</option>
          <option value="off">关闭</option>
        </select>
      </div>
    </div>
  </div>
</div>

<div class="panel info-panel">
  <div class="left-info">
    <div class="info-line">MIDI设备状态：<span id="midiStatus">未连接</span></div>
    <div class="row">
      <label>MIDI设备：</label>
      <select id="midiDeviceSelect"></select>
      <button id="refreshMidiBtn">刷新MIDI</button>
    </div>
    <div class="row">
      <label>音色选择：</label>
      <select id="toneSelect">
        <option value="piano">钢琴</option>
        <option value="electric_piano">电钢琴</option>
        <option value="synth">合成器</option>
        <option value="guitar">吉他</option>
      </select>
    </div>
    <div class="chord-display" id="chordDisplay">音名 / 和弦：无</div>
    <div class="interval-display" id="intervalDisplay">音程：无</div>
    <div class="interval-text" id="chordIntervalDisplay"></div>
    <div class="inversion-hint" id="inversionHint"></div>
  </div>
  <div class="staff-box" id="staffBox">
    <canvas id="staffCanvas"></canvas>
  </div>
</div>

<div class="panel">
  <div class="row">
    <label>和弦查询：</label>
    <select id="chordRoot"></select>
    <select id="chordType">
      <option value="maj">Major</option>
      <option value="maj7">Major7</option>
      <option value="min">Minor</option>
      <option value="min7">Minor7</option>
      <option value="7">Dominant7</option>
      <option value="dim">Diminished</option>
      <option value="aug">Augmented</option>
    </select>
    <select id="chordOctave"></select>
    <button id="showChordBtn">显示和弦指法</button>
  </div>
</div>

<div class="keyboard-wrap" id="keyboardWrap">
  <div class="keyboard" id="keyboardEl"></div>
</div>

<script>
// ========== 常量定义 ==========
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const DEGREE_MAP = [0,0,1,1,2,3,3,4,4,5,5,6]; // 半音->音级（白键序号）
const MIDI_MIN = 21;
const MIDI_MAX = 108;
let WHITE_KEY_WIDTH = 28;
let BLACK_KEY_WIDTH = 18;
const MIDDLE_C_MIDI = 60; // C4

const CHORD_INTERVALS = {
  maj:[0,4,7],
  maj7:[0,4,7,11],
  min:[0,3,7],
  min7:[0,3,7,10],
  7:[0,4,7,10],
  dim:[0,3,6],
  aug:[0,4,8]
};
const CHORD_INFO = {
  maj: { name: "大三和弦", intervals: ["根音", "大三度", "纯五度"] },
  maj7: { name: "大七和弦", intervals: ["根音", "大三度", "纯五度", "大七度"] },
  min: { name: "小三和弦", intervals: ["根音", "小三度", "纯五度"] },
  min7: { name: "小七和弦", intervals: ["根音", "小三度", "纯五度", "小七度"] },
  7: { name: "属七和弦", intervals: ["根音", "大三度", "纯五度", "小七度"] },
  dim: { name: "减三和弦", intervals: ["根音", "小三度", "减五度"] },
  aug: { name: "增三和弦", intervals: ["根音", "大三度", "增五度"] }
};

const METRO_SOUNDS = {
  classic: { name: "经典嘀嗒", osc: "sine", strong: 1200, weak: 800 },
  wood: { name: "木鱼", osc: "triangle", strong: 600, weak: 400 },
  electronic: { name: "电子", osc: "square", strong: 1500, weak: 1000 },
  click: { name: "响板", osc: "square", strong: 2200, weak: 1600 }
};

// 时值定义
const NOTE_VALUES = [
  { name: "whole",     min: 1600, filled: false, stem: false, flags: 0 },
  { name: "half",      min: 750,  filled: false, stem: true,  flags: 0 },
  { name: "quarter",   min: 260,  filled: true,  stem: true,  flags: 0 },
  { name: "eighth",    min: 110,  filled: true,  stem: true,  flags: 1 },
  { name: "sixteenth", min: 0,    filled: true,  stem: true,  flags: 2 }
];

// 音程名称
const INTERVAL_NAMES = [
  "纯一度", "小二度", "大二度", "小三度", "大三度",
  "纯四度", "增四度", "纯五度", "小六度", "大六度",
  "小七度", "大七度", "纯八度"
];

// 五线谱常量
const STAFF_LINE_SPACE = 11;
const NOTE_HEAD_W = 9;
const NOTE_HEAD_H = 6;
const STEM_LEN = 26;
const FLAG_GAP = 4;
const PIXELS_PER_BEAT = 30;

let synth;
let metroSynth;
const tonePresets = {
  piano:{type:'sampler',urls:{"C4":"https://tonejs.github.io/audio/salamander/C4.mp3"}},
  electric_piano:{type:'synth',oscillator:{type:'triangle'},envelope:{attack:0.02,decay:0.2,sustain:0.3,release:0.8}},
  synth:{type:'synth',oscillator:{type:'sawtooth'},envelope:{attack:0.01,decay:0.3,sustain:0.4,release:0.6}},
  guitar:{type:'synth',oscillator:{type:'triangle'},envelope:{attack:0.05,decay:0.4,sustain:0.2,release:1.2}}
};

let state = {
  activeNotes:new Map(),
  midiAccess:null,
  selectedMidiDevice:null,
  noteLabelMode:"all",
  themeMode:"system",
  chordSoundEnabled:true,
  metroSound:"classic",
  mouseGlideEnabled:true,
  staffEnabled:true,
  intervalEnabled:true,
  isPlaying:false,
  tapTimes:[],
  intDragTimer:null,
  decDragTimer:null,
  intDragStep:1,
  decDragStep:1,
  staffOffset:0
};

let isMouseDown = false;

// ========== 五线谱 ==========
let staffCanvas, staffCtx;
let staffNotes = [];
let chordStaffNotes = [];

let keyScale = 1;
const MIN_SCALE = 0.6;
const MAX_SCALE = 2.0;
let touchStartDist = 0;
let touchStartScale = 1;

const $ = s=>document.querySelector(s);
const midiStatusEl = $("#midiStatus");
const midiDeviceSelect = $("#midiDeviceSelect");
const refreshMidiBtn = $("#refreshMidiBtn");
const toneSelect = $("#toneSelect");
const chordDisplay = $("#chordDisplay");
const intervalDisplay = $("#intervalDisplay");
const chordIntervalDisplay = $("#chordIntervalDisplay");
const inversionHint = $("#inversionHint");
const keyboardEl = $("#keyboardEl");
const keyboardWrap = $("#keyboardWrap");
const noteLabelModeSel = $("#noteLabelMode");
const themeSettingSel = $("#themeSetting");
const chordSoundSetting = $("#chordSoundSetting");
const metroSoundSetting = $("#metroSoundSetting");
const mouseGlideSetting = $("#mouseGlideSetting");
const staffDisplaySetting = $("#staffDisplaySetting");
const intervalDisplaySetting = $("#intervalDisplaySetting");
const staffBox = $("#staffBox");
const themeBtn = $("#themeBtn");
const settingBtn = $("#settingBtn");
const settingModalWrap = $("#settingModalWrap");
const modalClose = $("#modalClose");
const chordRootSel = $("#chordRoot");
const chordTypeSel = $("#chordType");
const chordOctaveSel = $("#chordOctave");
const showChordBtn = $("#showChordBtn");

const playBtn = $("#playBtn");
const stopBtn = $("#stopBtn");
const tapBtn = $("#tapBtn");
const bpmIntEl = $("#bpmInt");
const bpmDecEl = $("#bpmDec");
const beatIndicators = $("#beatIndicators");
const tsNumerator = $("#tsNumerator");
const tsDenominator = $("#tsDenominator");


// ========== 工具函数 ==========
function midiToNote(midi){
  const idx = midi%12;
  const oct = Math.floor(midi/12)-1;
  return {name:NOTE_NAMES[idx],octave:oct,full:`${NOTE_NAMES[idx]}${oct}`};
}
function noteToMidi(name,octave){
  const idx = NOTE_NAMES.indexOf(name);
  return (octave+1)*12 + idx;
}
function isBlackKey(midiNote){
  const n = midiNote%12;
  return [1,3,6,8,10].includes(n);
}
function getAccidental(midi){
  const n = midi%12;
  if([1,3,6,8,10].includes(n)) return "♯";
  return "";
}
// 获取音级（用于五线谱垂直位置）
function getDiatonicDegree(midi){
  const octave = Math.floor(midi / 12) - 1;
  const pc = midi % 12;
  return octave * 7 + DEGREE_MAP[pc];
}

function calcIntervalName(midi1, midi2){
  const semitones = Math.abs(midi1 - midi2);
  const octaves = Math.floor(semitones / 12);
  const remain = semitones % 12;
  const baseName = INTERVAL_NAMES[remain];
  
  if(octaves === 0) return baseName;
  if(remain === 0) return `${octaves}个纯八度`;
  return `${octaves}个八度 + ${baseName}`;
}

function updateBpmDisplay(){
  const bpm = Tone.Transport.bpm.value;
  const intPart = Math.floor(bpm);
  const decPart = Math.round((bpm % 1) * 100);
  bpmIntEl.textContent = intPart;
  bpmDecEl.textContent = decPart.toString().padStart(2, '0');
}

function setBpm(value){
  const clamped = Math.max(20, Math.min(300, value));
  Tone.Transport.bpm.value = clamped;
  updateBpmDisplay();
}

function detectChord(midiNoteMap){
  const notes = Array.from(midiNoteMap.keys()).sort((a,b)=>a-b);
  if(notes.length===0) return {display:"无",notes:notes,isInversion:false};
  if(notes.length===1){
    const info = midiToNote(notes[0]);
    return {display:`${info.full}(单音)`,notes:notes,isInversion:false};
  }
  for(let root of notes){
    const rootMod = root%12;
    const rel = notes.map(n=>(n-rootMod+12)%12).sort((a,b)=>a-b);
    for(const [key,intervals] of Object.entries(CHORD_INTERVALS)){
      if(intervals.length===rel.length && intervals.every((v,i)=>v===rel[i])){
        const rootInfo = midiToNote(root);
        return {
          display:rootInfo.name + CHORD_INFO[key].name,
          notes:notes,
          isInversion:root!==notes[0],
          rootMidi:root,
          key:key
        }
      }
    }
  }
  const noteNames = notes.map(m=>midiToNote(m).full).join(",");
  return {display:`Add(${noteNames})`,notes:notes,isInversion:false};
}

function buildChordWithInversion(rootNoteName,octave,chordKey){
  const baseMidi = noteToMidi(rootNoteName,octave);
  const intervals = CHORD_INTERVALS[chordKey];
  const originalMidis = intervals.map(i=>baseMidi+i);
  const inversionNotes = [];
  const finalMidis = originalMidis.map(m => {
    if(m > MIDI_MAX){
      const shifted = m - 12;
      inversionNotes.push(shifted);
      return shifted;
    }
    return m;
  });
  const isInversion = inversionNotes.length > 0;
  const validMidis = finalMidis.filter(m=>m>=MIDI_MIN).sort((a,b)=>a-b);
  return {midiList: validMidis, isInversion, inversionNotes};
}

function renderKeyboard(){
  keyboardEl.innerHTML = "";
  let whiteKeyIndex = 0;
  
  for(let midi=MIDI_MIN; midi<=MIDI_MAX; midi++){
    const div = document.createElement("div");
    div.dataset.midi = midi;
    
    if(isBlackKey(midi)){
      div.classList.add("black");
      const leftPos = whiteKeyIndex * WHITE_KEY_WIDTH * keyScale - BLACK_KEY_WIDTH * keyScale / 2;
      div.style.left = `${leftPos}px`;
    }else{
      div.classList.add("white");
      div.style.left = `${whiteKeyIndex * WHITE_KEY_WIDTH * keyScale}px`;
      whiteKeyIndex++;
    }
    
    const label = document.createElement("div");
    label.classList.add("key-label");
    div.appendChild(label);

    div.addEventListener("mousedown", () => {
      isMouseDown = true;
      triggerNoteOn(midi);
    });
    div.addEventListener("mouseup", () => {
      triggerNoteOff(midi);
    });
    div.addEventListener("mouseenter", () => {
      if(state.mouseGlideEnabled && isMouseDown && !state.activeNotes.has(midi)){
        triggerNoteOn(midi);
      }
    });
    div.addEventListener("mouseleave", () => {
      if(state.mouseGlideEnabled){
        triggerNoteOff(midi);
      }
    });

    div.addEventListener("touchstart",e=>{
      e.preventDefault();
      triggerNoteOn(midi);
    });
    div.addEventListener("touchend",e=>{
      e.preventDefault();
      triggerNoteOff(midi);
    });
    
    keyboardEl.appendChild(div);
  }
  
  keyboardEl.style.width = `${whiteKeyIndex * WHITE_KEY_WIDTH * keyScale}px`;
  updateKeyLabels();
}

function updateKeyLabels(){
  const allKeys = keyboardEl.querySelectorAll("[data-midi]");
  for(const k of allKeys){
    const midi = Number(k.dataset.midi);
    const {name,full} = midiToNote(midi);
    const labelEl = k.querySelector(".key-label");
    
    switch(state.noteLabelMode){
      case "all": labelEl.textContent = full; break;
      case "octaveOnly": labelEl.textContent = name === 'C' ? full : ""; break;
      case "off": labelEl.textContent = ""; break;
    }
  }
}

function setKeyActive(midi,active){
  const el = keyboardEl.querySelector(`[data-midi="${midi}"]`);
  if(!el) return;
  el.classList.toggle("active",active);
}

async function initSynth(presetKey){
  await Tone.start();
  if(synth) synth.dispose();
  const preset = tonePresets[presetKey];
  if(preset.type==="sampler"){
    synth = new Tone.Sampler(preset.urls).toDestination();
  }else{
    synth = new Tone.Synth(preset).toDestination();
  }
}

function initMetroSynth(){
  metroSynth = new Tone.Synth({
    oscillator:{ type: METRO_SOUNDS[state.metroSound].osc },
    envelope:{ attack:0.001, decay:0.08, sustain:0, release:0.08 }
  }).toDestination();
}

function onBeat(time){
  const pos = Tone.Transport.position;
  const parts = pos.split(':');
  const beat = parseInt(parts[1]);
  const totalBeats = Tone.Transport.timeSignature[0];
  
  const sound = METRO_SOUNDS[state.metroSound];
  const isDownbeat = beat === 0;
  const freq = isDownbeat ? sound.strong : sound.weak;
  
  metroSynth.triggerAttackRelease(freq, "32n", time);
  
  Tone.Draw.schedule(() => {
    updateBeatLights(beat, totalBeats);
  }, time);
}

function updateBeatLights(currentBeat, totalBeats){
  const lights = beatIndicators.querySelectorAll(".beat-light");
  lights.forEach((light,i)=>{
    light.classList.remove("active","strong");
    if(i < totalBeats){
      light.style.display = "block";
      if(i === currentBeat){
        light.classList.add(i===0 ? "strong" : "active");
      }
    }else{
      light.style.display = "none";
    }
  });
}

async function triggerNoteOn(midi){
  await Tone.start();
  const freq = Tone.Midi(midi).toFrequency();
  synth.triggerAttack(freq);
  state.activeNotes.set(midi, performance.now());
  setKeyActive(midi,true);
  updateChordDisplay();
  updateIntervalDisplay();
  
  if(state.staffEnabled){
    addStaffNote(midi);
  }
}

function triggerNoteOff(midi){
  const freq = Tone.Midi(midi).toFrequency();
  synth.triggerRelease(freq);
  
  const startTime = state.activeNotes.get(midi);
  if(startTime){
    const duration = performance.now() - startTime;
    finalizeStaffNote(midi, duration);
  }
  
  state.activeNotes.delete(midi);
  setKeyActive(midi,false);
  updateChordDisplay();
  updateIntervalDisplay();
}

function stopAllNotes(){
  state.activeNotes.forEach((startTime, midi) => {
    const duration = performance.now() - startTime;
    finalizeStaffNote(midi, duration);
    triggerNoteOff(midi);
  });
}

function updateChordDisplay(){
  const res = detectChord(state.activeNotes);
  chordDisplay.textContent = `音名 / 和弦：${res.display}`;
  inversionHint.textContent = res.isInversion?"⚠️ 当前为转位和弦":"";
  
  if(res.key && CHORD_INFO[res.key]){
    const info = CHORD_INFO[res.key];
    chordIntervalDisplay.textContent = `构成：${info.intervals.join(" + ")}`;
  }else{
    chordIntervalDisplay.textContent = "";
  }
}

function updateIntervalDisplay(){
  if(!state.intervalEnabled){
    intervalDisplay.textContent = "";
    return;
  }
  
  const notes = Array.from(state.activeNotes.keys()).sort((a,b)=>a-b);
  if(notes.length === 2){
    const name = calcIntervalName(notes[0], notes[1]);
    intervalDisplay.textContent = `音程：${name}`;
  }else if(notes.length <= 1){
    intervalDisplay.textContent = "音程：无";
  }else{
    intervalDisplay.textContent = `音程：多音（${notes.length}个）`;
  }
}


// ========== 五线谱渲染（双谱表 乐理正确位置） ==========
function initStaff(){
  staffCanvas = document.getElementById('staffCanvas');
  staffCtx = staffCanvas.getContext('2d');
  resizeStaff();
  window.addEventListener('resize', resizeStaff);
  requestAnimationFrame(renderStaff);
}

function resizeStaff(){
  const box = staffCanvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  const cssWidth = box.clientWidth;
  const cssHeight = 210;
  
  staffCanvas.width = cssWidth * dpr;
  staffCanvas.height = cssHeight * dpr;
  staffCtx.scale(dpr, dpr);
  staffCanvas.style.width = cssWidth + 'px';
  staffCanvas.style.height = cssHeight + 'px';
}

function getStaffInfo(){
  const w = staffCanvas.clientWidth;
  const h = 210;
  const gap = 20;
  const totalHeight = h - gap;
  const singleHeight = totalHeight / 2;
  
  const trebleTopY = 10;
  const bassTopY = singleHeight + gap;
  
  // 基准：高音谱号第二线=G4(MIDI67)；低音谱号第四线=F3(MIDI53)
  const trebleRefY = trebleTopY + 1 * STAFF_LINE_SPACE; // 第二线
  const bassRefY = bassTopY + 3 * STAFF_LINE_SPACE; // 第四线
  
  return { w, h, gap, singleHeight, trebleTopY, bassTopY, trebleRefY, bassRefY };
}

function midiToStaffPos(midi){
  const { trebleRefY, bassRefY } = getStaffInfo();
  const degree = getDiatonicDegree(midi);
  
  if(midi >= MIDDLE_C_MIDI){
    // 高音谱表：基准G4(degree=32)在第二线
    const refDegree = 32;
    const diff = degree - refDegree;
    const y = trebleRefY - diff * (STAFF_LINE_SPACE / 2);
    return {
      clef: 'treble',
      y: y,
      ledgerBelow: diff <= -2 && diff % 2 === 0
    };
  }else{
    // 低音谱表：基准F3(degree=24)在第四线
    const refDegree = 24;
    const diff = degree - refDegree;
    const y = bassRefY - diff * (STAFF_LINE_SPACE / 2);
    return {
      clef: 'bass',
      y: y,
      ledgerAbove: diff >= 2 && diff % 2 === 0
    };
  }
}

function getNoteValue(duration){
  for(const v of NOTE_VALUES){
    if(duration >= v.min) return v;
  }
  return NOTE_VALUES[NOTE_VALUES.length-1];
}

function addStaffNote(midi){
  const pos = midiToStaffPos(midi);
  // 音符初始位置：画布75%处，按下立即可见
  staffNotes.push({
    midi: midi,
    x: staffCanvas.clientWidth * 0.75,
    y: pos.y,
    clef: pos.clef,
    ledgerBelow: pos.ledgerBelow,
    ledgerAbove: pos.ledgerAbove,
    isBlack: isBlackKey(midi),
    accidental: getAccidental(midi),
    startTime: performance.now(),
    duration: 0,
    active: true,
    value: null
  });
}

function finalizeStaffNote(midi, duration){
  for(let i = staffNotes.length - 1; i >= 0; i--){
    const note = staffNotes[i];
    if(note.midi === midi && note.active){
      note.duration = duration;
      note.active = false;
      note.value = getNoteValue(duration);
      break;
    }
  }
}

function showChordOnStaff(midiList){
  chordStaffNotes = [];
  midiList.forEach(midi => {
    const pos = midiToStaffPos(midi);
    chordStaffNotes.push({
      midi: midi,
      x: staffCanvas.clientWidth * 0.5,
      y: pos.y,
      clef: pos.clef,
      ledgerBelow: pos.ledgerBelow,
      ledgerAbove: pos.ledgerAbove,
      isBlack: isBlackKey(midi),
      accidental: getAccidental(midi)
    });
  });
  
  setTimeout(()=>{
    chordStaffNotes = [];
  }, 2500);
}

function drawStaffLines(){
  const { w, trebleTopY, bassTopY, trebleRefY, bassRefY } = getStaffInfo();
  
  staffCtx.strokeStyle = '#222';
  staffCtx.lineWidth = 1;
  
  // 高音谱表五条线
  for(let i = 0; i < 5; i++){
    const y = trebleTopY + i * STAFF_LINE_SPACE;
    staffCtx.beginPath();
    staffCtx.moveTo(0, y);
    staffCtx.lineTo(w, y);
    staffCtx.stroke();
  }
  
  // 低音谱表五条线
  for(let i = 0; i < 5; i++){
    const y = bassTopY + i * STAFF_LINE_SPACE;
    staffCtx.beginPath();
    staffCtx.moveTo(0, y);
    staffCtx.lineTo(w, y);
    staffCtx.stroke();
  }
  
  // 谱号
  staffCtx.font = '42px serif';
  staffCtx.fillStyle = '#222';
  staffCtx.textBaseline = 'middle';
  staffCtx.fillText('𝄞', 4, trebleRefY);
  staffCtx.fillText('𝄢', 6, bassRefY + 2);
  
  // 拍号（和节拍器联动）
  const numerator = tsNumerator.value;
  const denominator = tsDenominator.value;
  staffCtx.font = 'bold 16px sans-serif';
  staffCtx.textAlign = 'center';
  // 高音谱表拍号
  staffCtx.fillText(numerator, 40, trebleRefY - STAFF_LINE_SPACE - 1);
  staffCtx.fillText(denominator, 40, trebleRefY + STAFF_LINE_SPACE + 1);
  // 低音谱表拍号
  staffCtx.fillText(numerator, 40, bassRefY - STAFF_LINE_SPACE - 1);
  staffCtx.fillText(denominator, 40, bassRefY + STAFF_LINE_SPACE + 1);
  staffCtx.textAlign = 'left';
}

function drawBarLines(){
  const { w, trebleTopY, bassTopY } = getStaffInfo();
  const beatsPerBar = parseInt(tsNumerator.value);
  const barWidth = PIXELS_PER_BEAT * beatsPerBar;
  const offset = state.staffOffset % barWidth;
  
  staffCtx.strokeStyle = '#222';
  staffCtx.lineWidth = 1.2;
  
  for(let x = w - offset; x > 60; x -= barWidth){
    // 高音谱表小节线
    staffCtx.beginPath();
    staffCtx.moveTo(x, trebleTopY);
    staffCtx.lineTo(x, trebleTopY + 4 * STAFF_LINE_SPACE);
    staffCtx.stroke();
    
    // 低音谱表小节线
    staffCtx.beginPath();
    staffCtx.moveTo(x, bassTopY);
    staffCtx.lineTo(x, bassTopY + 4 * STAFF_LINE_SPACE);
    staffCtx.stroke();
  }
}

function drawNote(note){
  staffCtx.save();
  staffCtx.fillStyle = note.isBlack ? '#111' : '#222';
  staffCtx.strokeStyle = note.isBlack ? '#111' : '#222';
  staffCtx.lineWidth = 1.5;

  const { trebleTopY, bassTopY } = getStaffInfo();
  const midY = note.clef === 'treble' 
    ? trebleTopY + 2 * STAFF_LINE_SPACE 
    : bassTopY + 2 * STAFF_LINE_SPACE;
  
  const stemUp = note.y < midY;
  const stemX = stemUp ? note.x + NOTE_HEAD_W - 1 : note.x - NOTE_HEAD_W + 1;
  const stemY1 = note.y;
  const stemY2 = stemUp ? note.y - STEM_LEN : note.y + STEM_LEN;

  // 升降号
  if(note.accidental){
    staffCtx.font = '13px serif';
    staffCtx.textBaseline = 'middle';
    staffCtx.fillText(note.accidental, note.x - NOTE_HEAD_W - 10, note.y);
  }

  // 加线
  if(note.ledgerBelow || note.ledgerAbove){
    staffCtx.beginPath();
    staffCtx.moveTo(note.x - NOTE_HEAD_W - 3, note.y);
    staffCtx.lineTo(note.x + NOTE_HEAD_W + 3, note.y);
    staffCtx.lineWidth = 1;
    staffCtx.stroke();
  }

  // 符头
  staffCtx.beginPath();
  const filled = note.value ? note.value.filled : true;
  if(filled){
    staffCtx.ellipse(note.x, note.y, NOTE_HEAD_W, NOTE_HEAD_H, -0.25, 0, Math.PI * 2);
    staffCtx.fill();
  }else{
    staffCtx.ellipse(note.x, note.y, NOTE_HEAD_W, NOTE_HEAD_H, -0.25, 0, Math.PI * 2);
    staffCtx.stroke();
  }

  // 符干
  const hasStem = note.value ? note.value.stem : true;
  if(hasStem){
    staffCtx.beginPath();
    staffCtx.moveTo(stemX, stemY1);
    staffCtx.lineTo(stemX, stemY2);
    staffCtx.lineWidth = 1.5;
    staffCtx.stroke();

    // 符尾
    const flags = note.value ? note.value.flags : 0;
    if(flags > 0){
      const flagX = stemUp ? stemX : stemX;
      const flagStartY = stemUp ? stemY2 : stemY2;
      const flagDir = stemUp ? 1 : -1;

      for(let f = 0; f < flags; f++){
        const fy = flagStartY + f * FLAG_GAP * flagDir;
        staffCtx.beginPath();
        staffCtx.moveTo(flagX, fy);
        staffCtx.quadraticCurveTo(flagX + 9, fy + 2*flagDir, flagX + 2, fy + 6*flagDir);
        staffCtx.lineWidth = 1.8;
        staffCtx.stroke();
      }
    }
  }

  staffCtx.restore();
}

function renderStaff(){
  if(!state.staffEnabled){
    requestAnimationFrame(renderStaff);
    return;
  }

  const { w, h } = getStaffInfo();
  staffCtx.clearRect(0, 0, w, h);

  drawStaffLines();
  drawBarLines();

  // 和弦演示音符
  chordStaffNotes.forEach(note => {
    drawNote(note);
  });

  // 演奏音符
  for(let i = staffNotes.length - 1; i >= 0; i--){
    const note = staffNotes[i];
    note.x -= 0.8;

    if(note.x < -40){
      staffNotes.splice(i, 1);
      continue;
    }

    const value = note.active ? NOTE_VALUES[2] : note.value;
    drawNote({...note, value});
  }

  // 播放时滚动
  if(state.isPlaying){
    const bpm = Tone.Transport.bpm.value;
    const beatsPerSecond = bpm / 60;
    state.staffOffset += beatsPerSecond * PIXELS_PER_BEAT / 60;
  }

  requestAnimationFrame(renderStaff);
}


// ========== 节拍器控制 ==========
function togglePlay(){
  if(state.isPlaying){
    Tone.Transport.pause();
    playBtn.textContent = "▶";
    state.isPlaying = false;
  }else{
    Tone.start();
    Tone.Transport.start();
    playBtn.textContent = "⏸";
    state.isPlaying = true;
  }
}

function stopMetro(){
  Tone.Transport.stop();
  playBtn.textContent = "▶";
  state.isPlaying = false;
  state.staffOffset = 0;
  const totalBeats = Tone.Transport.timeSignature[0];
  updateBeatLights(-1, totalBeats);
}

function handleTap(){
  const now = Date.now();
  state.tapTimes.push(now);
  
  if(state.tapTimes.length > 8) state.tapTimes.shift();
  
  if(state.tapTimes.length >= 2){
    let totalInterval = 0;
    for(let i=1; i<state.tapTimes.length; i++){
      totalInterval += state.tapTimes[i] - state.tapTimes[i-1];
    }
    const avgInterval = totalInterval / (state.tapTimes.length - 1);
    const bpm = 60000 / avgInterval;
    
    if(bpm >= 20 && bpm <= 300){
      setBpm(bpm);
    }
  }
  
  clearTimeout(state.tapTimeout);
  state.tapTimeout = setTimeout(()=>{
    state.tapTimes = [];
  }, 2000);
}


// ========== BPM拖拽 ==========
function stopIntDrag(){
  if(state.intDragTimer){
    clearInterval(state.intDragTimer);
    state.intDragTimer = null;
  }
  document.removeEventListener("mousemove", onIntMouseMove);
  document.removeEventListener("mouseup", stopIntDrag);
}

function onIntMouseDown(e){
  if(e.button !== 0) return;
  e.preventDefault();
  const startY = e.clientY;
  let direction = 0;

  function onIntMouseMove(ev){
    const deltaY = startY - ev.clientY;
    if(deltaY > 3) direction = 1;
    else if(deltaY < -3) direction = -1;
    else direction = 0;
  }

  state.intDragTimer = setInterval(()=>{
    if(direction !== 0){
      const cur = Tone.Transport.bpm.value;
      setBpm(cur + direction * state.intDragStep);
    }
  },200);

  document.addEventListener("mousemove", onIntMouseMove);
  document.addEventListener("mouseup", stopIntDrag);
}

function stopDecDrag(){
  if(state.decDragTimer){
    clearInterval(state.decDragTimer);
    state.decDragTimer = null;
  }
  document.removeEventListener("mousemove", onDecMouseMove);
  document.removeEventListener("mouseup", stopDecDrag);
}

function onDecMouseDown(e){
  if(e.button !== 0) return;
  e.preventDefault();
  const startY = e.clientY;
  let direction = 0;

  function onDecMouseMove(ev){
    const deltaY = startY - ev.clientY;
    if(deltaY > 3) direction = 1;
    else if(deltaY < -3) direction = -1;
    else direction = 0;
  }

  state.decDragTimer = setInterval(()=>{
    if(direction !== 0){
      const cur = Tone.Transport.bpm.value;
      setBpm(cur + direction * 0.01);
    }
  },200);

  document.addEventListener("mousemove", onDecMouseMove);
  document.addEventListener("mouseup", stopDecDrag);
}


// ========== 双击编辑BPM ==========
function startBpmEdit(){
  const currentBpm = Tone.Transport.bpm.value.toFixed(2);
  
  const input = document.createElement("input");
  input.type = "number";
  input.className = "bpm-input";
  input.value = currentBpm;
  input.min = 20;
  input.max = 300;
  input.step = 0.01;
  
  $(".bpm-num-group").innerHTML = "";
  $(".bpm-num-group").appendChild(input);
  input.focus();
  input.select();
  
  function confirm(){
    const val = parseFloat(input.value);
    if(!isNaN(val)) setBpm(val);
    $(".bpm-num-group").innerHTML = `
      <span id="bpmInt">${Math.floor(Tone.Transport.bpm.value)}</span><span class="bpm-dot">.</span><span id="bpmDec">${Math.round((Tone.Transport.bpm.value % 1) * 100).toString().padStart(2,'0')}</span>
    `;
  }
  
  input.addEventListener("blur", confirm);
  input.addEventListener("keydown", (e)=>{
    if(e.key === "Enter") input.blur();
    if(e.key === "Escape"){ input.value = currentBpm; input.blur(); }
  });
}


// ========== MIDI设备 ==========
async function setupMidi(){
  if(!navigator.requestMIDIAccess){
    midiStatusEl.textContent = "浏览器不支持WebMIDI";
    return;
  }
  try{
    state.midiAccess = await navigator.requestMIDIAccess({sysex:false});
    midiStatusEl.textContent = "MIDI已就绪，请选择输入设备";
    fillMidiDeviceList();
    state.midiAccess.onstatechange = ()=>fillMidiDeviceList();
  }catch(e){
    midiStatusEl.textContent = "MIDI权限被拒绝";
  }
}
function fillMidiDeviceList(){
  midiDeviceSelect.innerHTML = "<option value=''>请选择MIDI输入</option>";
  if(!state.midiAccess) return;
  for(const input of state.midiAccess.inputs.values()){
    const opt = document.createElement("option");
    opt.value = input.id;
    opt.textContent = input.name;
    midiDeviceSelect.appendChild(opt);
  }

  const inputs = Array.from(state.midiAccess.inputs.values());
  if(inputs.length > 0){
    midiDeviceSelect.value = inputs[0].id;
    attachMidiInput(inputs[0].id);
  }
}
function attachMidiInput(deviceId){
  if(!state.midiAccess) return;
  if(state.selectedMidiDevice){
    state.selectedMidiDevice.onmidimessage = null;
  }
  const input = state.midiAccess.inputs.get(deviceId);
  if(!input) return;
  state.selectedMidiDevice = input;
  input.onmidimessage = (evt)=>{
    const [status,note,vel] = evt.data;
    const cmd = status>>4;
    if(cmd===9 && vel>0){
      triggerNoteOn(note);
    }else if(cmd===8 || (cmd===9&&vel===0)){
      triggerNoteOff(note);
    }
  };
  midiStatusEl.textContent = `✅已连接：${input.name}`;
}


// ========== 主题 ==========
function applyTheme(mode){
  let effective;
  if(mode==="system"){
    effective = window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  }else{
    effective = mode;
  }
  if(effective==="dark"){
    document.documentElement.setAttribute("data-theme","dark");
    themeBtn.textContent = "☀️";
  }else{
    document.documentElement.removeAttribute("data-theme");
    themeBtn.textContent = "🌙";
  }
}


// ========== 键盘缩放 ==========
function getTouchDistance(touches){
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

keyboardWrap.addEventListener("touchstart", (e)=>{
  if(e.touches.length === 2){
    e.preventDefault();
    touchStartDist = getTouchDistance(e.touches);
    touchStartScale = keyScale;
  }
}, { passive: false });

keyboardWrap.addEventListener("touchmove", (e)=>{
  if(e.touches.length === 2){
    e.preventDefault();
    const currentDist = getTouchDistance(e.touches);
    const ratio = currentDist / touchStartDist;
    let newScale = touchStartScale * ratio;
    newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
    
    if(Math.abs(newScale - keyScale) > 0.02){
      keyScale = newScale;
      document.documentElement.style.setProperty('--key-scale', keyScale);
      renderKeyboard();
      scrollToC4();
    }
  }
}, { passive: false });

keyboardWrap.addEventListener("touchend", ()=>{
  touchStartDist = 0;
});

function scrollToC4(){
  const keyEl = keyboardEl.querySelector(`[data-midi="${MIDDLE_C_MIDI}"]`);
  if(!keyEl) return;
  const wrapWidth = keyboardWrap.clientWidth;
  const keyLeft = keyEl.offsetLeft;
  keyboardWrap.scrollLeft = keyLeft - wrapWidth / 2 + WHITE_KEY_WIDTH * keyScale / 2;
}


// ========== 全局事件 ==========
document.addEventListener('mouseup', () => {
  isMouseDown = false;
  stopAllNotes();
});
document.addEventListener('touchend', () => {
  stopAllNotes();
});


// ========== 事件绑定 ==========
playBtn.addEventListener("click", togglePlay);
stopBtn.addEventListener("click", stopMetro);
tapBtn.addEventListener("click", handleTap);

bpmUp.addEventListener("click",()=>{
  const current = Tone.Transport.bpm.value;
  const intPart = Math.floor(current);
  const decPart = current % 1;
  setBpm(intPart + 1 + decPart);
});
bpmDown.addEventListener("click",()=>{
  const current = Tone.Transport.bpm.value;
  const intPart = Math.floor(current);
  const decPart = current % 1;
  setBpm(intPart - 1 + decPart);
});

bpmIntEl.addEventListener("mousedown", onIntMouseDown);
bpmDecEl.addEventListener("mousedown", onDecMouseDown);

document.querySelector(".bpm-num-group").addEventListener("dblclick", startBpmEdit);

function updateTimeSignature(){
  const num = parseInt(tsNumerator.value);
  const den = parseInt(tsDenominator.value);
  Tone.Transport.timeSignature = [num, den];
  updateBeatLights(-1, num);
}
tsNumerator.addEventListener("change", updateTimeSignature);
tsDenominator.addEventListener("change", updateTimeSignature);

noteLabelModeSel.addEventListener("change",e=>{
  state.noteLabelMode = e.target.value;
  updateKeyLabels();
});
chordSoundSetting.addEventListener("change",e=>{
  state.chordSoundEnabled = e.target.value === "on";
});
metroSoundSetting.addEventListener("change",e=>{
  state.metroSound = e.target.value;
  if(metroSynth){
    metroSynth.oscillator.type = METRO_SOUNDS[state.metroSound].osc;
  }
});
mouseGlideSetting.addEventListener("change",e=>{
  state.mouseGlideEnabled = e.target.value === "on";
  stopAllNotes();
});
staffDisplaySetting.addEventListener("change",e=>{
  state.staffEnabled = e.target.value === "on";
  staffBox.classList.toggle("hidden", !state.staffEnabled);
});
intervalDisplaySetting.addEventListener("change",e=>{
  state.intervalEnabled = e.target.value === "on";
  updateIntervalDisplay();
});

toneSelect.addEventListener("change",async e=>{
  await initSynth(e.target.value);
});
midiDeviceSelect.addEventListener("change",e=>attachMidiInput(e.target.value));
refreshMidiBtn.addEventListener("click",setupMidi);

themeBtn.addEventListener("click",()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  applyTheme(cur==="dark"?"light":"dark");
});
themeSettingSel.addEventListener("change",e=>{
  state.themeMode = e.target.value;
  applyTheme(state.themeMode);
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{
  if(state.themeMode==="system") applyTheme("system");
});

settingBtn.addEventListener("click",()=>{
  settingModalWrap.style.display="flex";
});
modalClose.addEventListener("click",()=>{
  settingModalWrap.style.display="none";
});
settingModalWrap.addEventListener("click",(e)=>{
  if(e.target===settingModalWrap) settingModalWrap.style.display="none";
});

// 和弦查询
function initChordSelectors(){
  chordRootSel.innerHTML = "";
  for(const n of NOTE_NAMES){
    const o = document.createElement("option");
    o.value = n;o.textContent = n;
    chordRootSel.appendChild(o);
  }
  chordOctaveSel.innerHTML = "";
  for(let o=0;o<=8;o++){
    const opt = document.createElement("option");
    opt.value = o;opt.textContent = o;
    chordOctaveSel.appendChild(opt);
  }
  chordRootSel.value = "C";
  chordOctaveSel.value = 4;
}

showChordBtn.addEventListener("click",async ()=>{
  const root = chordRootSel.value;
  const ctype = chordTypeSel.value;
  const oct = Number(chordOctaveSel.value);
  const {midiList, isInversion, inversionNotes} = buildChordWithInversion(root,oct,ctype);
  
  keyboardEl.querySelectorAll(".chord-highlight").forEach(el=>{
    el.classList.remove("chord-highlight");
    el.classList.remove("inversion-note");
  });
  
  midiList.forEach(midi => {
    const el = keyboardEl.querySelector(`[data-midi="${midi}"]`);
    if(el){
      el.classList.add("chord-highlight");
      if(inversionNotes.includes(midi)){
        el.classList.add("inversion-note");
      }
    }
  });

  if(state.staffEnabled){
    showChordOnStaff(midiList);
  }

  if(state.chordSoundEnabled){
    await Tone.start();
    midiList.forEach(midi => {
      const freq = Tone.Midi(midi).toFrequency();
      synth.triggerAttack(freq);
    });
  }
  
  const info = CHORD_INFO[ctype];
  const intervalStr = info.intervals.join(" + ");
  let text = `${root}${oct} ${info.name}：${intervalStr}`;
  if(isInversion) text += "（已自动转位，超出音域的音符已移低八度）";
  chordIntervalDisplay.textContent = text;
  inversionHint.textContent = isInversion?"⚠️ 红色边框标记为转位音符":"";
  
  setTimeout(()=>{
    midiList.forEach(midi => {
      const el = keyboardEl.querySelector(`[data-midi="${midi}"]`);
      if(el && !state.activeNotes.has(midi)){
        el.classList.remove("chord-highlight");
        el.classList.remove("inversion-note");
      }
      if(state.chordSoundEnabled && !state.activeNotes.has(midi)){
        const freq = Tone.Midi(midi).toFrequency();
        synth.triggerRelease(freq);
      }
    });
  },2500);
});


// ========== 启动 ==========
(async function bootstrap(){
  state.themeMode = "system";
  themeSettingSel.value = "system";
  chordSoundSetting.value = "on";
  metroSoundSetting.value = "classic";
  mouseGlideSetting.value = "on";
  staffDisplaySetting.value = "on";
  intervalDisplaySetting.value = "on";
  applyTheme(state.themeMode);
  renderKeyboard();
  initChordSelectors();
  
  await initSynth("piano");
  initMetroSynth();
  initStaff();
  
  setBpm(120);
  Tone.Transport.timeSignature = [4,4];
  updateBeatLights(-1, 4);
  
  Tone.Transport.scheduleRepeat(onBeat, "4n");
  
  await setupMidi();

  setTimeout(scrollToC4, 100);
})();
</script>
